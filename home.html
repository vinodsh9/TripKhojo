<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripKhojo – Discover India by budget</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&amp;family=Kaushan+Script&amp;family=Anton&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2EFE9;font-family:Manrope,system-ui,sans-serif;color:#0B1622}
a{color:#0B1622}
button,input,select{font:inherit}
.tk-unb{font-family:Unbounded,Manrope,sans-serif}
.tk-anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:0.01em}
@keyframes tkKen{from{transform:scale(1.02)}to{transform:scale(1.14)}}
@keyframes tkRise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes tkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tkLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes tkDash{to{stroke-dashoffset:-60}}
@keyframes tkSpin{to{transform:rotate(360deg)}}
@keyframes tkPing{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
@keyframes tkDrift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.tk-ken{animation:tkKen 9s ease-out both}
.tk-rise{animation:tkRise 1s cubic-bezier(.2,.7,.2,1) both}
.tk-d1{animation-delay:.15s}.tk-d2{animation-delay:.3s}.tk-d3{animation-delay:.45s}
.tk-float{animation:tkFloat 5s ease-in-out infinite}
.tk-float2{animation:tkFloat 6s ease-in-out infinite;animation-delay:-2s}
.tk-float3{animation:tkFloat 7s ease-in-out infinite;animation-delay:-4s}
.tk-scrollline{animation:tkLine 2.2s ease-in-out infinite}
.tk-route{stroke-dasharray:3 9;animation:tkDash 2s linear infinite}
.tk-spin{transform-origin:400px 400px;animation:tkSpin 60s linear infinite}
.tk-spinr{transform-origin:400px 400px;animation:tkSpin 90s linear infinite reverse}
.tk-ping{transform-box:fill-box;transform-origin:center;animation:tkPing 2.2s ease-out infinite}
.tk-dots{animation:tkDrift 12s linear infinite}
.tk-card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.tk-card:hover{transform:translateY(-10px);box-shadow:0 34px 60px -30px rgba(11,22,34,.55)}
.tk-img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tk-card:hover .tk-img{transform:scale(1.1)}
.tk-arrow{display:inline-block;transition:transform .3s}
.tk-card:hover .tk-arrow,.tk-btn:hover .tk-arrow{transform:translateX(5px)}
.tk-btn{transition:transform .2s,box-shadow .25s,background .25s}
.tk-btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(232,124,18,.8)}
.tk-glass{background:rgba(255,255,255,0.14);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.tk-slide{transition:opacity 1.4s ease}
.tk-brush{font-family:'Kaushan Script',cursive;font-weight:400;letter-spacing:0}
.tk-kblock{position:absolute;z-index:5;left:max(32px,calc((100% - 1360px)/2 + 32px));top:104px;width:min(620px,calc(100% - 64px));display:flex;flex-direction:column;gap:14px;color:#FFFFFF}
.tk-kphoto{position:absolute;top:0;right:0;bottom:0;width:68%}
.tk-kfade{position:absolute;inset:0;background:linear-gradient(90deg,#0A1A2E 30%,rgba(10,26,46,0.75) 42%,rgba(10,26,46,0) 62%),linear-gradient(0deg,rgba(6,15,23,0.75) 0%,rgba(6,15,23,0) 35%)}
.tk-chipk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:102px;height:92px;border-radius:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.22);font-size:13px;font-weight:700;text-align:center;line-height:1.2;backdrop-filter:blur(8px);transition:transform .25s,background .25s}
.tk-chipk:hover{transform:translateY(-4px);background:rgba(255,255,255,0.16)}
.tk-desk{display:flex}.tk-mob{display:none}.tk-hide-all{display:none !important}
@media (max-width:980px){.tk-kphoto{width:100%}.tk-kfade{background:linear-gradient(0deg,rgba(10,26,46,0.96) 40%,rgba(10,26,46,0.55) 75%,rgba(10,26,46,0.3) 100%)}.tk-kblock{top:auto;bottom:40px;gap:10px}.tk-ktitle{font-size:72px !important}.tk-kcrown{letter-spacing:0.22em !important;font-size:14px !important}.tk-kchips{display:none !important}.tk-ktrust{display:none !important}.tk-hidem{display:none !important}#top{min-height:700px !important}.tk-desk{display:none}.tk-mob{display:flex}.tk-hero-name{font-size:54px !important}.tk-big{font-size:72px !important}.tk-h2{font-size:34px !important}}
input[type=range]{accent-color:#E87C12}
:focus-visible{outline:3px solid #F09A3E;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>


<style>
body{margin:0}
@keyframes scMist{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes scBird{0%{transform:translate(0,0)}100%{transform:translate(260px,-60px)}}
@keyframes scWave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.sc-mist{animation:scMist 18s ease-in-out infinite alternate}
.sc-mist2{animation:scMist 26s ease-in-out infinite alternate-reverse}
.sc-bird{animation:scBird 22s linear infinite}
.sc-wave{animation:scWave 9s linear infinite}
@keyframes scRapid{from{transform:translateX(0)}to{transform:translateX(-160px)}}
@keyframes scBob{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(18px,-10px) rotate(4deg)}}
@keyframes scSway{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.sc-rapid{animation:scRapid 2.6s linear infinite}
.sc-rapid2{animation:scRapid 3.8s linear infinite}
.sc-bob{transform-box:fill-box;transform-origin:center;animation:scBob 2.4s ease-in-out infinite}
.sc-sway{animation:scSway 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
