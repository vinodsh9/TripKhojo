<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rishikesh Weekend Trip from Delhi Under ₹5,000 – TripKhojo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F2EC;font-family:Manrope,system-ui,sans-serif;color:#0B1622}
a{color:#0D5C6B}a:hover{color:#08404B}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-0.03em}
button{font:inherit}
.tk-serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-0.02em}
@keyframes tkRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes tkBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tkDash{to{stroke-dashoffset:-56}}
@keyframes tkPing{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes tkFlow{from{transform:translateX(0)}to{transform:translateX(-300px)}}
.tk-rise{animation:tkRise .8s cubic-bezier(.2,.7,.2,1) both}
.tk-d1{animation-delay:.12s}.tk-d2{animation-delay:.24s}.tk-d3{animation-delay:.36s}
.tk-bar{transform-origin:left;animation:tkBar .9s cubic-bezier(.2,.7,.2,1) both}
.tk-route{stroke-dasharray:4 10;animation:tkDash 2.4s linear infinite}
.tk-ping{transform-box:fill-box;transform-origin:center;animation:tkPing 2.4s ease-out infinite}
.tk-flow{animation:tkFlow 14s linear infinite}
.tk-pc{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.tk-pc:hover{transform:translateY(-6px);box-shadow:0 26px 44px -24px rgba(11,22,34,.5)}
.tk-btn{transition:transform .2s,box-shadow .25s}
.tk-btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(232,124,18,.75)}
:focus-visible{outline:3px solid #F09A3E;outline-offset:2px}
@media (max-width:980px){.tk-h1{font-size:44px !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
