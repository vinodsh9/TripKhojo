<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripKhojo – The Journey Engine</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&amp;family=Kaushan+Script&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#03070F;font-family:Manrope,system-ui,sans-serif;color:#FFFFFF}
a{color:#F6C36A}
button,input,select{font:inherit}
.tk-unb{font-family:Unbounded,Manrope,sans-serif}
.tk-brush{font-family:'Kaushan Script',cursive;font-weight:400}
.tk-stat{background:rgba(255,255,255,0.05);border:1px solid rgba(140,180,255,0.22);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.tk-stat span{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#B9C7E0;line-height:1.25}
.tk-stat strong{font-size:14px;color:#FFFFFF}
@keyframes tkFadeOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes tkRise{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes tkSlideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes tkPop{0%{opacity:0;transform:scale(.86) translateY(30px)}100%{opacity:1;transform:none}}
@keyframes tkPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes tkBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tkLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes tkShine{from{background-position:-200% 0}to{background-position:200% 0}}
.tk-intro{animation:tkFadeOut 1.6s ease .2s both;pointer-events:none}
.tk-rise{animation:tkRise 1.1s cubic-bezier(.2,.7,.2,1) both}
.tk-i1{animation-delay:3s}.tk-i2{animation-delay:3.35s}.tk-i3{animation-delay:3.7s}.tk-i4{animation-delay:4s}
.tk-in{animation:tkSlideIn .7s cubic-bezier(.2,.7,.2,1) both}
.tk-pop{animation:tkPop .8s cubic-bezier(.2,.9,.2,1) both}
.tk-dot{animation:tkPulse 1s ease-in-out infinite}
.tk-bar{transform-origin:left;animation:tkBar .9s cubic-bezier(.2,.7,.2,1) both}
.tk-scrollline{animation:tkLine 2.2s ease-in-out infinite}
.tk-glass{background:rgba(14,26,48,0.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(140,180,255,0.22)}
.tk-cta{position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.tk-cta:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 18px 40px -14px rgba(246,195,106,.75)}
.tk-cta:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);background-size:200% 100%;opacity:0;transition:opacity .3s}
.tk-cta:hover:after{opacity:1;animation:tkShine 1.1s linear}
.tk-ghost{transition:background .25s,border-color .25s}
.tk-gcard{transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s}
.tk-gcard:hover{transform:translateY(-8px);border-color:#F6C36A;box-shadow:0 20px 55px rgba(0,0,0,0.5)}
.tk-gimg{transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.tk-gcard:hover .tk-gimg{transform:scale(1.08)}
.tk-arrow{display:inline-block;transition:transform .3s}
.tk-gcard:hover .tk-arrow{transform:translateX(5px)}
.tk-ghost:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.6)}
.tk-left{position:absolute;left:40px;top:100px;bottom:24px;width:min(440px,calc(100% - 80px));display:flex;flex-direction:column;justify-content:center;gap:14px;pointer-events:none;z-index:6;overflow-y:auto;scrollbar-width:none}
.tk-left::-webkit-scrollbar{display:none}
.tk-left > *{pointer-events:auto}
.tk-right{position:absolute;right:40px;top:100px;width:420px;max-height:calc(100% - 124px);overflow:auto;z-index:7}
.tk-desk{display:flex}
@media (max-width:980px){
.tk-stage{height:auto !important;min-height:0 !important;display:flex;flex-direction:column;padding-bottom:92px}
.tk-canvas{position:relative !important;inset:auto !important;height:64vh !important;min-height:420px;flex:0 0 auto;order:1}
.tk-left,.tk-right{position:relative !important;left:auto !important;right:auto !important;top:auto !important;bottom:auto !important;width:auto !important;max-height:none !important;overflow:visible !important;margin:0 14px 14px}
.tk-right{order:2}.tk-left{order:3;justify-content:flex-start}
.tk-dockwrap{position:fixed !important;bottom:12px !important;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px)}
.tk-spinpill{bottom:auto !important;top:calc(64vh - 70px)}
.tk-modal{position:fixed !important}
.tk-desk{display:none !important}
.tk-h1{font-size:28px !important}
.tk-dock button{padding:0 12px !important;font-size:12px !important;height:42px !important}
.tk-stat{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}
.tk-right .tk-cta{flex:1 1 100% !important}
}
input[type=range]{accent-color:#F6C36A}
:focus-visible{outline:3px solid #F6C36A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;animation-delay:0s !important;transition:none !important}}
</style>


<style>
body{margin:0}
@keyframes scMist{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
@keyframes scBird{0%{transform:translate(0,0)}100%{transform:translate(260px,-60px)}}
@keyframes scWave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
.sc-mist{animation:scMist 18s ease-in-out infinite alternate}
.sc-mist2{animation:scMist 26s ease-in-out infinite alternate-reverse}
.sc-bird{animation:scBird 22s linear infinite}
.sc-wave{animation:scWave 9s linear infinite}
@keyframes scRapid{from{transform:translateX(0)}to{transform:translateX(-160px)}}
@keyframes scBob{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(18px,-10px) rotate(4deg)}}
@keyframes scSway{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.sc-rapid{animation:scRapid 2.6s linear infinite}
.sc-rapid2{animation:scRapid 3.8s linear infinite}
.sc-bob{transform-box:fill-box;transform-origin:center;animation:scBob 2.4s ease-in-out infinite}
.sc-sway{animation:scSway 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>

<style>html,body{margin:0}#app{min-height:100vh}</style>
