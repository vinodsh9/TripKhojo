<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripKhojo – Tell us who's travelling</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&amp;family=Kaushan+Script&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050B16;font-family:Manrope,system-ui,sans-serif;color:#FFFFFF}
a{color:#F6C36A}
button,input,select,textarea{font:inherit}
.tk-unb{font-family:Unbounded,Manrope,sans-serif}
.tk-brush{font-family:'Kaushan Script',cursive;font-weight:400}
@keyframes tkRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes tkPop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:none}}
@keyframes tkKen{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.tk-rise{animation:tkRise .8s cubic-bezier(.2,.7,.2,1) both}.tk-d1{animation-delay:.12s}.tk-d2{animation-delay:.24s}
.tk-pop{animation:tkPop .7s cubic-bezier(.2,.9,.2,1) both}
.tk-ken{animation:tkKen 12s ease-out both}
.tk-step{width:46px;height:46px;border-radius:12px;border:1px solid rgba(140,180,255,0.35);background:#0A1426;color:#FFFFFF;font-size:22px;font-weight:700;cursor:pointer}
.tk-step:hover{border-color:#F6C36A}
.tk-cta{transition:transform .2s,box-shadow .25s}.tk-cta:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(246,195,106,.8)}
:focus-visible{outline:3px solid #F6C36A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
