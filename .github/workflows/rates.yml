name: Update exchange rates
on:
  schedule:
    - cron: '37 */4 * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/rates.py', '.github/workflows/rates.yml']
permissions:
  contents: write
concurrency: data-update
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rates.py
      - run: |
          git config user.name "TripKhojo bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || (git commit -m "Update exchange rates" && git pull --rebase -q && git push)
