<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripKhojo – Planning tools</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F2EC;font-family:Manrope,system-ui,sans-serif;color:#0B1622}
a{color:#0D5C6B}a:hover{color:#08404B}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-0.03em}
input,select,button{font:inherit}
.tk-serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-0.02em}
@keyframes tkRise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes tkDash{to{stroke-dashoffset:-56}}
@keyframes tkPing{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
@keyframes tkGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes tkBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tkPulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes tkShimmer{from{background-position:-400px 0}to{background-position:400px 0}}
@keyframes tkMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes tkCount{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tk-rise{animation:tkRise .9s cubic-bezier(.2,.7,.2,1) both}
.tk-d1{animation-delay:.12s}.tk-d2{animation-delay:.24s}.tk-d3{animation-delay:.36s}.tk-d4{animation-delay:.5s}
.tk-route{stroke-dasharray:4 10;animation:tkDash 2.4s linear infinite}
.tk-ping{transform-box:fill-box;transform-origin:center;animation:tkPing 2.4s ease-out infinite}
.tk-col{transform-origin:bottom;animation:tkGrow 1s cubic-bezier(.2,.7,.2,1) both}
.tk-bar{transform-origin:left;animation:tkBar 1s cubic-bezier(.2,.7,.2,1) both}
.tk-dot{animation:tkPulse 1.1s ease-in-out infinite}
.tk-shim{background:linear-gradient(90deg,#ECE7DD 0%,#F7F4EE 50%,#ECE7DD 100%);background-size:800px 100%;animation:tkShimmer 1.3s linear infinite}
.tk-marq{animation:tkMarquee 48s linear infinite}
.tk-num{animation:tkCount .5s ease both}
.tk-pc{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.tk-pc:hover{transform:translateY(-8px);box-shadow:0 30px 50px -24px rgba(11,22,34,.55)}
.tk-zoom{transition:transform 1.1s cubic-bezier(.2,.7,.2,1);transform-origin:center}
.tk-pc:hover .tk-zoom{transform:scale(1.12) rotate(-1deg)}
.tk-pc:hover .tk-arrow{transform:translateX(6px)}
.tk-arrow{transition:transform .3s;display:inline-block}
.tk-btn{transition:transform .2s,box-shadow .25s,background .2s}
.tk-btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -12px rgba(232,124,18,.75)}
.tk-btn:active{transform:translateY(0) scale(.98)}
.tk-link{position:relative;text-decoration:none}
.tk-link:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:#F09A3E;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.tk-link:hover:after{transform:scaleX(1)}
.tk-scroll{scroll-snap-type:x mandatory;overflow-x:auto;scrollbar-width:none}
.tk-scroll::-webkit-scrollbar{display:none}
.tk-snap{scroll-snap-align:start}
.tk-desk{display:flex}.tk-mob{display:none}
@media (max-width:980px){#top > svg{opacity:0.3}.tk-desk{display:none}.tk-mob{display:flex}.tk-h1{font-size:46px !important}.tk-h2{font-size:36px !important}}
input[type=range]{accent-color:#E87C12}
:focus-visible{outline:3px solid #F09A3E;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>


<style>html,body{margin:0}#app{min-height:100vh}</style>
